patch:
  # -----------------------------------------------------------------
  # 1. 设置默认输入方案为雾凇全拼
  # -----------------------------------------------------------------
  schema_list:
    - schema: rime_ice

  # -----------------------------------------------------------------
  # 2. 修改候选词数量为 7 个
  # -----------------------------------------------------------------
  "menu/page_size": 7

  # -----------------------------------------------------------------
  # 3. 按句号 '.' 直接提交第 1 个候选词上屏，并紧跟输入句号 '。'
  # -----------------------------------------------------------------
  "key_binder/bindings/@next": { accept: period, send: period, when: has_menu }

  # -----------------------------------------------------------------
  # 4. 新增全局快捷键切换：
  #  - Ctrl + Shift + F : 切换 繁体 / 简体 (traditionalization)
  #  - Ctrl + . (period): 切换 全角 / 半角 (full_shape)
  # -----------------------------------------------------------------
  "key_binder/bindings/+":
    - { accept: "Control+Shift+F", toggle: traditionalization, when: always }
    - { accept: "Control+period", toggle: ascii_punct, when: always }
