# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json

gui:
  # ========================= UI 主题与颜色配置（EVA 主题）=========================
  theme:
    activeBorderColor:
      - "#C86CFF" # 激活窗口边框：超亮初号机紫
      - bold
    inactiveBorderColor:
      - "#808080" # 非激活窗口边框：中灰
    searchingActiveBorderColor:
      - "#FF4C4C" # 搜索时边框：鲜红警示
    optionsTextColor:
      - "#B6FF40" # 快捷键提示：荧光黄绿
    selectedLineBgColor:
      - "#4B0082" # 选中行背景：靛紫（在黑底下极清晰）
    inactiveViewSelectedLineBgColor:
      - "#660099" # 非激活选中行背景：紫红调（非激活选中行也醒目）
    cherryPickedCommitFgColor:
      - "#000000" # cherry-pick 前景：黑
    cherryPickedCommitBgColor:
      - "#FF99CC" # cherry-pick 背景：粉红高亮（更柔和更显眼）
    markedBaseCommitFgColor:
      - "#000000" # 变基基准提交前景：黑
    markedBaseCommitBgColor:
      - "#FFE680" # 变基基准提交背景：金色提亮
    unstagedChangesColor:
      - "#FF7256" # 未暂存变更：珊瑚红
    defaultFgColor:
      - "#FFFFFF" # 默认文字颜色：纯白

  # ✨ 新增：按分支名前缀自动着色，一眼分辨分支类型（沿用同一套 EVA 配色）
  branchColorPatterns:
    "^feature/": "#B6FF40" # 功能分支：荧光黄绿
    "^(fix|bugfix)/": "#FF7256" # 修复分支：珊瑚红
    "^hotfix/": "#FF4C4C" # 紧急修复：鲜红警示
    "^release/": "#FFE680" # 发布分支：金色

  # ✨ 可选：固定你自己提交的颜色，不受随机配色影响（把 Your Name 换成 git user.name）
  # authorColors:
  #   "Your Name": "#B6FF40"

  # 界面布局与显示设置
  # 窗口边框样式：rounded | single | double | hidden | bold
  border: double
  # 放大当前聚焦的侧边面板，提供手风琴效果
  expandFocusedSidePanel: true
  # 放大面板的高度权重
  expandedSidePanelWeight: 2
  # 提交时间显示格式
  timeFormat: "02 Jan 2006"
  # 24 小时内的时间显示格式
  shortTimeFormat: "3:04PM"
  # 在文件视图中显示每个文件的修改行数
  showNumstatInFilesView: true
  # 长行自动换行，适合处理长文本
  wrapLinesInStagingView: true
  # 启用 Nerd Fonts v3 图标，让界面更美观
  nerdFontsVersion: "3"
  # 显示文件列表中的文件图标
  showFileIcons: true
  # 搜索过滤模式：substring（子串匹配）| fuzzy（模糊匹配）
  filterMode: fuzzy
  # 状态面板视图模式：dashboard 提供概览，allBranchesLog 显示所有分支日志
  statusPanelView: dashboard
  # 提交作者名显示长度（展开视图），这里设为 17，让长名字也能完整显示
  commitAuthorLongLength: 17
  # 提交哈希显示长度，设为 8，够用且不占空间
  # commitHashLength: 8
  # 在分支视图中显示提交哈希，方便快速识别分支
  showBranchCommitHash: true
  # 显示与基础分支的偏离情况，方便了解分支状态
  showDivergenceFromBaseBranch: arrowAndNumber
  # 自动分屏模式，只有当一个文件同时有暂存和未暂存的修改时才分屏
  splitDiff: auto

  # ✨ 新增：文件树中文件夹优先排列，浏览项目结构更清晰
  fileTreeSortOrder: foldersFirst

  # ✨ 新增：接近列表/长 diff 底部时提前滚动，浏览更顺滑（默认 2，这里调大一点）
  scrollOffMargin: 3
  # 滚动方式：margin（提前滚动）| jump（跳到屏幕中间）
  scrollOffBehavior: margin

  # ✨ 新增：启动时不显示随机小贴士，界面更干净清爽
  showRandomTip: true

  # 交互行为设置
  # 启用鼠标事件支持
  mouseEvents: true
  # 当你尝试提交但没有任何暂存文件时，LazyGit 会自动将所有未暂存的文件添加到暂存区并提交，而不会弹出警告提示。
  skipNoStagedFilesWarning: true
  # 在重置工作区时，显示爆炸动画
  animateExplosion: true
  # 切换面板时，如果目标面板已激活，则切换标签页
  switchTabsWithPanelJumpKeys: false
  # pop stash 后自动跳转到文件面板，方便继续工作
  switchToFilesAfterStashPop: true
  # ✨ 新增：apply stash 后也跳转到文件面板，和 pop 的行为保持一致
  switchToFilesAfterStashApply: true

# 退出 Lazygit 时显示确认弹窗
confirmOnQuit: false

# ✨ 新增：关闭首次运行时的介绍弹窗，减少干扰
disableStartupPopups: true

# 优化 git 行为
git:
  # 自动抓取远程分支更新
  autoFetch: true
  # 自动刷新文件和子模块
  autoRefresh: true
  # 自动快进主分支
  autoForwardBranches: onlyMainBranches
  # 默认在提交时使用 topo-order 排序，使提交历史图更易读
  log:
    order: topo-order
    showGraph: always
  # 在提交信息中启用 emoji 解析，让提交信息更生动
  parseEmoji: true

  # ✨ 新增：diff 默认显示更多上下文行，理解改动上下文更容易（默认 3，这里调到 5）
  diffContextSize: 5

  # ✨ 可选：根据分支名自动生成 commit 前缀，例如 feature/AB-123 → "[AB-123] "
  # 按你团队/自己的分支命名规则调整下面的正则
  # commitPrefix:
  #   - pattern: "^(feature|fix|hotfix)\\/(\\w+-\\d+).*"
  #     replace: "[$2] "

  # ✨ 可选：如果本机装了 delta（更好看、带语法高亮的 diff 分页器），取消注释启用
  # 安装：brew install git-delta（或对应发行版的包管理器）
  # pagers:
  #   - pager: delta --dark --paging=never

os:
  # ✨ 可选：按你常用的编辑器取消注释一行，设置后 'e' 键会用它打开文件
  # 可选值：vim/nvim/lvim/emacs/nano/micro/vscode/sublime/bbedit/kakoune/helix/xcode/zed/acme
  editPreset: "nvim"

  # ✨ 可选：在 tmux 里希望复制内容能同步到系统剪贴板（OSC52），取消注释
  # 并在 tmux.conf 里加一行：set -g allow-passthrough on
  # copyToClipboardCmd: >
  #   if [[ "$TERM" =~ ^(screen|tmux) ]]; then
  #     printf "\033Ptmux;\033\033]52;c;$(printf {{text}} | base64 -w 0)\a\033\\" > /dev/tty
  #   else
  #     printf "\033]52;c;$(printf {{text}} | base64 -w 0)\a" > /dev/tty
  #   fi

keybinding:
  universal:
    # ✨ 新增：ctrl+j / ctrl+k 作为光标上下移动的额外按键（不影响原有的 ↑↓ 和 j/k）
    nextItem-alt: <ctrl+j>
    prevItem-alt: <ctrl+k>
  # ✨ 新增：commits 面板默认也用 ctrl+j/ctrl+k 移动选中的提交，与上面的全局光标移动冲突，
  # 这里去掉这两个键，只保留原本就有的备用键 alt+↓ / alt+↑，功能不受影响
  commits:
    moveDownCommit: <alt-down>
    moveUpCommit: <alt-up>
