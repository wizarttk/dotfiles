################################################################################
# ~/.config/picom/picom.conf
# Picom X11 复合器【极致美化版】配置文件 · VMware 稳定性优化版 · rules 迁移版
# 配套主题：Catppuccin Mocha / Tokyo Night / Nord
# 特色：分层玻璃矩阵 + 悬浮立体阴影 + 电影级焦外暗化 + VMware 崩溃规避优化
#
# 本版相对上一版的变更：
#   修复 "picom Warning!" 弹窗提示的全部 offending options：
#     - active-opacity / inactive-opacity / inactive-opacity-override /
#       inactive-dim  -> 迁移为 rules 里 "focused"/"!focused" 的规则
#     - shadow-exclude / blur-background-exclude / rounded-corners-exclude
#       -> 迁移为具体的 rules 条目（并补全了 FlameShot/Slop/通知窗口的排除）
#     - mark-wmwin-focused / mark-ovredir-focused -> 直接删除（rules 的
#       focused 匹配不再需要这两个旧式焦点探测开关）
#     - glx-no-stencil / glx-no-rebind-pixmap -> 直接删除（新版统一后端
#       架构不再需要这两个老 GLX 补丁开关）
#   这些都只是新旧写法的等价迁移，视觉效果和上一版完全一致。
################################################################################

#################################
#          后端与稳定性 (Backend)
#################################
# 使用 GLX (OpenGL) 渲染，双重缓冲保证高帧率毛玻璃
backend = "glx";

# 虚拟机兼容性优化
vsync = false;               # 关键项：避免与 vmwgfx 的 vblank 同步竞态，是此前崩溃的根本规避手段，不要改回 true
use-damage = false;           # 只重绘变化区域，降低负载；若重新出现残影问题，改回 false

#################################
#          极致毛玻璃 (Blur)
#################################
# 使用 dual_kawase 极佳模糊算法
blur-method = "dual_kawase";

# 模糊强度：8
blur-strength = 8;
blur-background = true;
blur-background-fixed = true;

#################################
#          精致圆角 (Corners)
#################################
# 基础圆角：12px
corner-radius = 12;
round-borders = 2;

#################################
#       分层立体阴影 (Shadows)
#################################
shadow = true;

# 阴影基础参数：22px 虚化 + 48% 不透明度
shadow-radius = 22;
shadow-opacity = 0.48;

# 阴影偏移：产生光线从左上方照射的悬浮感
shadow-offset-x = -18;
shadow-offset-y = -18;

# Catppuccin Mocha Crust 色调 (#11111b)，带有一丝极深紫色的弥散质感
shadow-color = "#11111b";

#################################
#          平滑过渡动画 (Animations)
#################################
animations = (
    {
        triggers = ["open", "show"];
        preset = "appear";          # 打开时：微缩放平滑弹出
        duration = 0.18;
    },
    {
        triggers = ["close", "hide"];
        preset = "disappear";       # 关闭时：微缩放平滑收起
        duration = 0.15;
    },
    {
        triggers = ["geometry"];    # dwm 切换平铺布局时：窗口位置平滑流动
        preset = "geometry-change";
        duration = 0.22;            # 0.22s 保证丝滑感
    }
);

#################################
#          淡入淡出 (Fading)
#################################
# 注：这里主要负责聚焦/失焦时的透明度渐变，跟上面 animations 里 open/close
# 的缩放淡入是两套并存的机制。如果实际用起来觉得窗口打开时有种"淡入了
# 两次"的生硬感，可以自行把 fading 关掉、只留 animations 试试。
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

#################################
#    电影级焦外暗化 (Cinematic Focus)
#################################
# 说明：原来这里的 active-opacity / inactive-opacity / inactive-opacity-override /
# inactive-dim 已经全部迁移到下面 rules 的 "focused" / "!focused" 规则里，
# 这两项是 rules 覆盖不到的全局开关，继续保留在顶层。
frame-opacity = 1.0;
inactive-dim-fixed = true;

#################################
#    全系统玻璃化矩阵 (Unified Rules)
#    (核心：焦点透明度/暗化 + 各类排除规则 + 分应用精细化配置)
#################################
rules = (
    # 0. 【全局默认透明度与暗化】替代旧版 active-opacity / inactive-opacity /
    #    inactive-opacity-override / inactive-dim，效果完全等价。放在最前面，
    #    后面针对具体应用的 opacity 规则会按顺序覆盖这里的默认值。
    {
        match = "focused";
        opacity = 1.0;
    },
    {
        match = "!focused";
        opacity = 0.90;
        dim = 0.08;              # 未聚焦窗口暗化 8%
    },

    # 1. 【输入法专属】：0ms 零延迟秒开秒关（无动画、无阴影、无模糊）
    {
        match = "class_g *= 'fcitx' || class_g *= 'Fcitx' || window_type = 'popup_menu' || window_type = 'utility' || window_type = 'dropdown_menu'";
        fade = false;
        shadow = false;
        blur-background = true;
        corner-radius = 15;
        opacity = 1.0;            # 弹窗类不参与焦外暗化
        animations = (
            { triggers = ["open", "show", "close", "hide", "geometry"]; duration = 0; }
        );
    },

    # 2. 【状态栏 (Polybar)】：支持 Catppuccin 悬浮毛玻璃 + 圆角 + 阴影
    {
        match = "class_g = 'Polybar'";
        blur-background = true;      # 开启双重毛玻璃
        shadow = false;               # 开启悬浮阴影
        corner-radius = 12;          # 12px 优雅圆角（如果 Polybar 做成悬浮胶囊状）
        opacity = 0.92;              # 保持高透明度
    },

    # 2.1 替代旧版 blur-background-exclude 里的 _GTK_FRAME_EXTENTS@:c
    {
        match = "_GTK_FRAME_EXTENTS@:c";
        blur-background = false;
    },

    # 2.2 【截图工具】替代旧版 blur-background-exclude / shadow-exclude 里的 FlameShot / Slop
    {
        match = "class_g = 'FlameShot' || class_g = 'Slop'";
        blur-background = false;   # 防止截图/区域选择时画面发虚
    },
    {
        match = "class_g = 'FlameShot'";
        shadow = false;
    },

    # 2.3 替代旧版 shadow-exclude 里的 _NET_WM_WINDOW_TYPE_NOTIFICATION
    {
        match = "_NET_WM_WINDOW_TYPE:a = '_NET_WM_WINDOW_TYPE_NOTIFICATION'";
        shadow = false;
    },

    # 3. 【终端 (Terminal)】：80% 极具赛博极客感的高透毛玻璃 + 冷色调阴影
    {
        match = "class_g = 'Alacritty' || class_g = 'kitty' || class_g = 'foot'";
        opacity = 0.72;
        shadow-color = "#1e2030";   # 偏冷青蓝色阴影，呼应终端的赛博质感
    },

    # 4. 【应用发射器 (Rofi)】：88% 半透明 + 16px 大圆角
    {
        match = "class_g = 'Rofi'";
        opacity = 0.88;              # 模糊背景下文字更清晰
        corner-radius = 16;
    },

    # 5. 【通知弹窗 (Dunst)】：88% 半透明 + 14px 圆角
    {
        match = "class_g = 'Dunst'";
        opacity = 0.88;
        corner-radius = 14;
    },

    # 6. 【文件管理器 (Thunar/PCManFM)】：88% 微透毛玻璃（能看清文字，又保留质感）
    {
        match = "class_g = 'Thunar' || class_g = 'pcmanfm' || class_g = 'Nautilus'";
        opacity = 0.88;
    },

    # 7. 【代码编辑器 (VS Code / Neovide)】：92% 微透（专注于代码，不刺眼）
    {
        match = "class_g = 'code-oss' || class_g = 'Code' || class_g = 'neovide'";
        opacity = 0.92;
    },

    # 8. 【浏览器 (Firefox / Chromium)】：始终 100% 不透明（保证看视频不透光），不参与焦外暗化
    {
        match = "class_g = 'firefox' || class_g = 'Chromium' || class_g = 'Brave-browser'";
        opacity = 1.0;
    }
);

#################################
#          杂项与兼容性 (Misc)
#################################
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
transparent-clipping = false;
