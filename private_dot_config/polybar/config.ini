[colors]
; 带 Alpha 透明度的颜色 (格式 #AARRGGBB，a0 表示约 62% 不透明度，配合 Picom Blur)
background = #a01e1e2e
background-alt = #313244
foreground = #cdd6f4
primary = #cba6f7
secondary = #89b4fa
alert = #f38ba8
disabled = #6c7086

[bar/main]
width = 90%
height = 21pt
radius = 12

offset-x = 5%
offset-y = 8px

; 必须保留，让 Polybar 告知 X11 它是 Dock 窗口
override-redirect = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
border-size = 4pt
border-color = #00000000

padding-left = 1
padding-right = 1
module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "Noto Sans CJK SC:size=10;2"

; 模块布局 (已修正：xworkspaces 只保留一个)
modules-left = xworkspaces
modules-right = cpu memory pulseaudio date tray

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; dwm 标签联动模块 (配合 dwm ewmhtags 补丁)
[module/xworkspaces]
type = internal/xworkspaces

; 关键补全开关：关闭锁定当前屏幕，开启点击切换
pin-workspaces = false
enable-click = true
enable-scroll = false

; 1. 【当前工作区 (Active)】
label-active = %name%
label-active-background = #cba6f7
label-active-foreground = #11111b
label-active-padding = 2

; 2. 【有窗口的工作区 (Occupied)】
label-occupied = %name%
label-occupied-background = #313244
label-occupied-foreground = #cdd6f4
label-occupied-padding = 2

; 3. 【无窗口的空工作区 (Empty)】
label-empty = %name%
label-empty-background = #00000000
label-empty-foreground = #585b70
label-empty-padding = 2

; 4. 【紧急通知 (Urgent)】
label-urgent = %name%
label-urgent-background = #f38ba8
label-urgent-foreground = #11111b
label-urgent-padding = 2

; CPU 监控
[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

; 内存监控
[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

; 音量控制
[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = "󰝟 muted"
label-muted-foreground = ${colors.disabled}

; 日期与时间
[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d %H:%M
label = %date%
label-foreground = ${colors.primary}

[module/tray]
type = internal/tray
tray-spacing = 8px
