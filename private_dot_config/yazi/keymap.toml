[mgr]

keymap = [
  { on = [
    "<Esc>",
  ], run = "escape", desc = "退出视觉模式 / 清除选中 / 取消搜索" },
  { on = [
    "<C-[>",
  ], run = "escape", desc = "退出视觉模式 / 清除选中 / 取消搜索" },
  { on = [
    "q",
  ], run = "quit", desc = "退出 Yazi" },
  { on = [
    "Q",
  ], run = "quit --no-cwd-file", desc = "退出 Yazi (不保存当前工作目录)" },
  { on = [
    "<C-q>",
  ], run = "close", desc = "关闭当前标签页 (最后一个标签页时退出)" },
  { on = [
    "<C-z>",
  ], run = "suspend", desc = "挂起进程 (后台运行)" },

  # 视图布局与全屏/全展
  { on = [
    "F",
  ], run = "maximize", desc = "全屏/全展预览区域 (切换最大化)" },
  { on = [
    "<F11>",
  ], run = "maximize", desc = "全屏/全展预览区域 (切换最大化)" },

  # 基础导航
  { on = [
    "k",
  ], run = "arrow -1", desc = "向上移动光标" },
  { on = [
    "j",
  ], run = "arrow 1", desc = "向下移动光标" },

  { on = [
    "K",
  ], run = "arrow -5", desc = "向上移动 5 行" },
  { on = [
    "J",
  ], run = "arrow 5", desc = "向下移动 5 行" },

  { on = [
    "<S-Up>",
  ], run = "arrow -5", desc = "向上移动 5 行" },
  { on = [
    "<S-Down>",
  ], run = "arrow 5", desc = "向下移动 5 行" },

  { on = [
    "<C-u>",
  ], run = "arrow -5", desc = "向上翻半页" },
  { on = [
    "<C-d>",
  ], run = "arrow 5", desc = "向下翻半页" },

  { on = [
    "h",
  ], run = "leave", desc = "返回上一级目录" },
  { on = [
    "l",
  ], run = "enter", desc = "进入子目录" },

  { on = [
    "H",
  ], run = "back", desc = "返回上一次访问的目录" },
  { on = [
    "L",
  ], run = "forward", desc = "前进到下一个目录" },

  { on = [
    "<Up>",
  ], run = "arrow -1", desc = "向上移动光标" },
  { on = [
    "<Down>",
  ], run = "arrow 1", desc = "向下移动光标" },
  { on = [
    "<Left>",
  ], run = "leave", desc = "返回上一级目录" },
  { on = [
    "<Right>",
  ], run = "enter", desc = "进入子目录" },

  { on = [
    "g",
    "g",
  ], run = "arrow top", desc = "移动光标到顶部" },
  { on = [
    "G",
  ], run = "arrow bot", desc = "移动光标到底部" },

  # 多选模式
  { on = [
    "<Space>",
  ], run = [
    "select --state=none",
    "arrow 1",
  ], desc = "切换当前文件选中状态" },
  { on = [
    "v",
  ], run = "visual_mode", desc = "进入视觉选择模式" },
  { on = [
    "V",
  ], run = "visual_mode --unset", desc = "进入视觉取消选择模式" },
  { on = [
    "<C-a>",
  ], run = "select_all --state=true", desc = "选中所有文件" },
  { on = [
    "<C-r>",
  ], run = "select_all --state=none", desc = "反选所有文件" },

  # 文件管理操作
  { on = [
    "o",
  ], run = "open", desc = "打开选中文件" },
  { on = [
    "O",
  ], run = "open --interactive", desc = "交互式选择打开方式" },
  { on = [
    "<Enter>",
  ], run = "open", desc = "打开选中文件" },
  { on = [
    "<C-Enter>",
  ], run = "open --interactive", desc = "交互式选择打开方式" },
  { on = [
    "y",
  ], run = "yank", desc = "复制选中文件" },
  { on = [
    "Y",
  ], run = "unyank", desc = "取消复制/剪切状态" },
  { on = [
    "x",
  ], run = "yank --cut", desc = "剪切选中文件" },
  { on = [
    "X",
  ], run = "unyank", desc = "取消复制/剪切状态" },
  { on = [
    "p",
  ], run = "paste", desc = "粘贴文件" },
  { on = [
    "P",
  ], run = "paste --force", desc = "强制粘贴文件 (覆盖同名文件)" },
  { on = [
    "-",
  ], run = "link", desc = "创建绝对路径软链接" },
  { on = [
    "_",
  ], run = "link --relative", desc = "创建相对路径软链接" },
  { on = [
    "d",
  ], run = "remove", desc = "将文件移至回收站" },
  { on = [
    "D",
  ], run = "remove --permanently", desc = "永久删除文件" },
  { on = [
    "a",
  ], run = "create", desc = "创建文件/目录 (以 / 结尾创建目录)" },
  { on = [
    "r",
  ], run = "rename --cursor=before_ext", desc = "重命名文件/目录" },
  { on = [
    ";",
  ], run = "shell --interactive", desc = "运行终端命令" },
  { on = [
    ":",
  ], run = "shell --confirm ", desc = "运行终端命令 (阻塞 UI 直至结束)" },
  { on = [
    ".",
  ], run = "hidden toggle", desc = "切换显示/隐藏文件" },
  { on = [
    "s",
  ], run = "search fd", desc = "使用 fd 按文件名搜索" },
  { on = [
    "S",
  ], run = "search rg", desc = "使用 ripgrep 搜索文件内容" },
  { on = [
    "<C-s>",
  ], run = "search none", desc = "取消当前搜索" },
  { on = [
    "z",
  ], run = "jump zoxide", desc = "使用 zoxide 快速跳转" },
  { on = [
    "Z",
  ], run = "jump fzf", desc = "使用 fzf 模糊搜索并跳转/定位" },

  # 行展示模式
  { on = [
    "<Tab>",
  ], run = "spot", desc = "悬浮展示文件/目录详细元数据" },
  { on = [
    "m",
    "s",
  ], run = "linemode size", desc = "行模式：显示文件大小" },
  { on = [
    "m",
    "p",
  ], run = "linemode permissions", desc = "行模式：显示文件权限" },
  { on = [
    "m",
    "m",
  ], run = "linemode mtime", desc = "行模式：显示修改时间" },
  { on = [
    "m",
    "n",
  ], run = "linemode none", desc = "行模式：关闭附加信息" },

  # 复制路径/名称
  { on = [
    "c",
    "c",
  ], run = "copy path", desc = "复制绝对路径" },
  { on = [
    "c",
    "d",
  ], run = "copy dirname", desc = "复制父目录路径" },
  { on = [
    "c",
    "f",
  ], run = "copy filename", desc = "复制文件名" },
  { on = [
    "c",
    "n",
  ], run = "copy name_without_ext", desc = "复制主文件名 (不含后缀)" },

  # 过滤文件
  { on = [
    "f",
  ], run = "filter --smart", desc = "过滤当前目录文件" },

  # 正反向查找
  { on = [
    "/",
  ], run = "find --smart", desc = "正向查找文件" },
  { on = [
    "?",
  ], run = "find --previous --smart", desc = "反向查找文件" },
  { on = [
    "n",
  ], run = "find_arrow", desc = "跳至下一个匹配项" },
  { on = [
    "N",
  ], run = "find_arrow --previous", desc = "跳至上一个匹配项" },

  # 排序规则
  { on = [
    ",",
    "m",
  ], run = "sort modified --dir-first", desc = "按修改时间排序" },
  { on = [
    ",",
    "M",
  ], run = "sort modified --reverse --dir-first", desc = "按修改时间倒序" },
  { on = [
    ",",
    "c",
  ], run = "sort created --dir-first", desc = "按创建时间排序" },
  { on = [
    ",",
    "C",
  ], run = "sort created --reverse --dir-first", desc = "按创建时间倒序" },
  { on = [
    ",",
    "e",
  ], run = "sort extension --dir-first", desc = "按扩展名排序" },
  { on = [
    ",",
    "E",
  ], run = "sort extension --reverse --dir-first", desc = "按扩展名倒序" },
  { on = [
    ",",
    "a",
  ], run = "sort alphabetical --dir-first", desc = "按字母顺序排序" },
  { on = [
    ",",
    "A",
  ], run = "sort alphabetical --reverse --dir-first", desc = "按字母倒序" },
  { on = [
    ",",
    "n",
  ], run = "sort natural --dir-first", desc = "按自然顺序排序" },
  { on = [
    ",",
    "N",
  ], run = "sort natural --reverse --dir-first", desc = "按自然倒序" },
  { on = [
    ",",
    "s",
  ], run = "sort size --dir-first", desc = "按文件大小排序" },
  { on = [
    ",",
    "S",
  ], run = "sort size --reverse --dir-first", desc = "按文件大小倒序" },

  # 标签页管理
  { on = [
    "t",
  ], run = "tab_create --current", desc = "在新标签页打开当前路径" },

  { on = [
    "1",
  ], run = "tab_switch 0", desc = "切换到第 1 个标签页" },
  { on = [
    "2",
  ], run = "tab_switch 1", desc = "切换到第 2 个标签页" },
  { on = [
    "3",
  ], run = "tab_switch 2", desc = "切换到第 3 个标签页" },
  { on = [
    "4",
  ], run = "tab_switch 3", desc = "切换到第 4 个标签页" },
  { on = [
    "5",
  ], run = "tab_switch 4", desc = "切换到第 5 个标签页" },
  { on = [
    "6",
  ], run = "tab_switch 5", desc = "切换到第 6 个标签页" },
  { on = [
    "7",
  ], run = "tab_switch 6", desc = "切换到第 7 个标签页" },
  { on = [
    "8",
  ], run = "tab_switch 7", desc = "切换到第 8 个标签页" },
  { on = [
    "9",
  ], run = "tab_switch 8", desc = "切换到第 9 个标签页" },

  { on = [
    "[",
  ], run = "tab_switch -1 --relative", desc = "切换到上一个标签页" },
  { on = [
    "]",
  ], run = "tab_switch 1 --relative", desc = "切换到下一个标签页" },

  { on = [
    "{",
  ], run = "tab_swap -1", desc = "将当前标签页左移" },
  { on = [
    "}",
  ], run = "tab_swap 1", desc = "将当前标签页右移" },

  # 任务管理
  { on = [
    "w",
  ], run = "tasks_show", desc = "显示任务管理器" },

  # 🚀 Goto 快速跳转目录大表 (已扩展丰富常用路径)
  { on = [
    "g",
    "h",
  ], run = "cd ~", desc = "跳转到 用户主目录 (~)" },
  { on = [
    "g",
    "c",
  ], run = "cd ~/.config", desc = "跳转到 配置目录 (~/.config)" },
  { on = [
    "g",
    "d",
  ], run = "cd ~/Downloads", desc = "跳转到 下载目录 (~/Downloads)" },
  { on = [
    "g",
    "D",
  ], run = "cd ~/Desktop", desc = "跳转到 桌面目录 (~/Desktop)" },
  { on = [
    "g",
    "p",
  ], run = "cd ~/Pictures", desc = "跳转到 图片目录 (~/Pictures)" },
  { on = [
    "g",
    "v",
  ], run = "cd ~/Videos", desc = "跳转到 视频目录 (~/Videos)" },
  { on = [
    "g",
    "m",
  ], run = "cd ~/Music", desc = "跳转到 音乐目录 (~/Music)" },
  { on = [
    "g",
    "o",
  ], run = "cd ~/Documents", desc = "跳转到 文档目录 (~/Documents)" },
  { on = [
    "g",
    "t",
  ], run = "cd /tmp", desc = "跳转到 临时目录 (/tmp)" },
  { on = [
    "g",
    "r",
  ], run = "cd /", desc = "跳转到 根目录 (/)" },
  { on = [
    "g",
    "e",
  ], run = "cd /etc", desc = "跳转到 系统配置目录 (/etc)" },
  { on = [
    "g",
    "u",
  ], run = "cd /usr", desc = "跳转到 用户软件目录 (/usr)" },
  { on = [
    "g",
    "l",
  ], run = "cd ~/.local", desc = "跳转到 Local 目录 (~/.local)" },
  { on = [
    "g",
    "s",
  ], run = "cd ~/.local/share", desc = "跳转到 Local Share 目录 (~/.local/share)" },
  { on = [
    "g",
    "<Space>",
  ], run = "cd --interactive", desc = "交互式输入路径跳转" },

  # 帮助菜单
  { on = [
    "~",
  ], run = "help", desc = "打开帮助菜单" },
]

[tasks]

keymap = [
  { on = [
    "<Esc>",
  ], run = "close", desc = "隐藏任务管理器" },
  { on = [
    "<C-[>",
  ], run = "close", desc = "隐藏任务管理器" },
  { on = [
    "<C-q>",
  ], run = "close", desc = "隐藏任务管理器" },
  { on = [
    "w",
  ], run = "close", desc = "隐藏任务管理器" },

  { on = [
    "k",
  ], run = "arrow -1", desc = "向上移动光标" },
  { on = [
    "j",
  ], run = "arrow 1", desc = "向下移动光标" },

  { on = [
    "<Up>",
  ], run = "arrow -1", desc = "向上移动光标" },
  { on = [
    "<Down>",
  ], run = "arrow 1", desc = "向下移动光标" },

  { on = [
    "<Enter>",
  ], run = "inspect", desc = "查看任务详情" },
  { on = [
    "x",
  ], run = "cancel", desc = "取消当前任务" },

  { on = [
    "~",
  ], run = "help", desc = "打开帮助菜单" },
]

[select]

keymap = [
  { on = [
    "<Esc>",
  ], run = "close", desc = "取消选择" },
  { on = [
    "<C-[>",
  ], run = "close", desc = "取消选择" },
  { on = [
    "<C-q>",
  ], run = "close", desc = "取消选择" },
  { on = [
    "<Enter>",
  ], run = "close --submit", desc = "确认选择" },

  { on = [
    "k",
  ], run = "arrow -1", desc = "向上移动光标" },
  { on = [
    "j",
  ], run = "arrow 1", desc = "向下移动光标" },

  { on = [
    "K",
  ], run = "arrow -5", desc = "向上移动 5 行" },
  { on = [
    "J",
  ], run = "arrow 5", desc = "向下移动 5 行" },

  { on = [
    "<Up>",
  ], run = "arrow -1", desc = "向上移动光标" },
  { on = [
    "<Down>",
  ], run = "arrow 1", desc = "向下移动光标" },

  { on = [
    "<S-Up>",
  ], run = "arrow -5", desc = "向上移动 5 行" },
  { on = [
    "<S-Down>",
  ], run = "arrow 5", desc = "向下移动 5 行" },

  { on = [
    "~",
  ], run = "help", desc = "打开帮助菜单" },
]

[input]

keymap = [
  { on = [
    "<C-q>",
  ], run = "close", desc = "取消输入" },
  { on = [
    "<Enter>",
  ], run = "close --submit", desc = "提交输入" },
  { on = [
    "<Esc>",
  ], run = "escape", desc = "返回普通模式或取消输入" },
  { on = [
    "<C-[>",
  ], run = "escape", desc = "返回普通模式或取消输入" },

  # 模式切换
  { on = [
    "i",
  ], run = "insert", desc = "进入插入模式" },
  { on = [
    "a",
  ], run = "insert --append", desc = "进入追加模式" },
  { on = [
    "I",
  ], run = [
    "move -999",
    "insert",
  ], desc = "移动到行首并进入插入模式" },
  { on = [
    "A",
  ], run = [
    "move 999",
    "insert --append",
  ], desc = "移动到行尾并进入追加模式" },
  { on = [
    "v",
  ], run = "visual", desc = "进入视觉选择模式" },
  { on = [
    "V",
  ], run = [
    "move -999",
    "visual",
    "move 999",
  ], desc = "进入视觉模式并全选" },

  # 字符级移动
  { on = [
    "h",
  ], run = "move -1", desc = "向左移动一个字符" },
  { on = [
    "l",
  ], run = "move 1", desc = "向右移动一个字符" },
  { on = [
    "<Left>",
  ], run = "move -1", desc = "向左移动一个字符" },
  { on = [
    "<Right>",
  ], run = "move 1", desc = "向右移动一个字符" },
  { on = [
    "<C-b>",
  ], run = "move -1", desc = "向左移动一个字符" },
  { on = [
    "<C-f>",
  ], run = "move 1", desc = "向右移动一个字符" },

  # 词级移动
  { on = [
    "b",
  ], run = "backward", desc = "移动到上一个词首" },
  { on = [
    "w",
  ], run = "forward", desc = "移动到下一个词首" },
  { on = [
    "e",
  ], run = "forward --end-of-word", desc = "移动到词尾" },
  { on = [
    "<A-b>",
  ], run = "backward", desc = "移动到上一个词首" },
  { on = [
    "<A-f>",
  ], run = "forward --end-of-word", desc = "移动到词尾" },

  # 行级移动
  { on = [
    "0",
  ], run = "move -999", desc = "移动到行首" },
  { on = [
    "$",
  ], run = "move 999", desc = "移动到行尾" },
  { on = [
    "<C-a>",
  ], run = "move -999", desc = "移动到行首" },
  { on = [
    "<C-e>",
  ], run = "move 999", desc = "移动到行尾" },
  { on = [
    "<Home>",
  ], run = "move -999", desc = "移动到行首" },
  { on = [
    "<End>",
  ], run = "move 999", desc = "移动到行尾" },

  # 删除操作
  { on = [
    "<Backspace>",
  ], run = "backspace", desc = "删除光标前字符" },
  { on = [
    "<Delete>",
  ], run = "backspace --under", desc = "删除光标处字符" },
  { on = [
    "<C-h>",
  ], run = "backspace", desc = "删除光标前字符" },
  { on = [
    "<C-d>",
  ], run = "backspace --under", desc = "删除光标处字符" },

  # 快速剪切 (Kill)
  { on = [
    "<C-u>",
  ], run = "kill bol", desc = "剪切至行首" },
  { on = [
    "<C-k>",
  ], run = "kill eol", desc = "剪切至行尾" },
  { on = [
    "<C-w>",
  ], run = "kill backward", desc = "剪切至词首" },
  { on = [
    "<A-d>",
  ], run = "kill forward", desc = "剪切至词尾" },

  # 剪切/复制/粘贴
  { on = [
    "d",
  ], run = "delete --cut", desc = "剪切选中字符" },
  { on = [
    "D",
  ], run = [
    "delete --cut",
    "move 999",
  ], desc = "剪切至行尾" },
  { on = [
    "c",
  ], run = "delete --cut --insert", desc = "剪切选中字符并进入插入模式" },
  { on = [
    "C",
  ], run = [
    "delete --cut --insert",
    "move 999",
  ], desc = "剪切至行尾并进入插入模式" },
  { on = [
    "x",
  ], run = [
    "delete --cut",
    "move 1 --in-operating",
  ], desc = "剪切当前字符" },
  { on = [
    "y",
  ], run = "yank", desc = "复制选中字符" },
  { on = [
    "p",
  ], run = "paste", desc = "在光标后粘贴" },
  { on = [
    "P",
  ], run = "paste --before", desc = "在光标前粘贴" },

  # 撤销/重做
  { on = [
    "u",
  ], run = "undo", desc = "撤销上次操作" },
  { on = [
    "<C-r>",
  ], run = "redo", desc = "重做上次操作" },

  # 帮助菜单
  { on = [
    "~",
  ], run = "help", desc = "打开帮助菜单" },
]

[completion]

keymap = [
  { on = [
    "<C-q>",
  ], run = "close", desc = "取消补全" },
  { on = [
    "<Tab>",
  ], run = "close --submit", desc = "应用当前补全" },
  { on = [
    "<Enter>",
  ], run = [
    "close --submit",
    "close_input --submit",
  ], desc = "应用补全并提交" },

  { on = [
    "<A-k>",
  ], run = "arrow -1", desc = "向上移动光标" },
  { on = [
    "<A-j>",
  ], run = "arrow 1", desc = "向下移动光标" },

  { on = [
    "<Up>",
  ], run = "arrow -1", desc = "向上移动光标" },
  { on = [
    "<Down>",
  ], run = "arrow 1", desc = "向下移动光标" },

  { on = [
    "<C-p>",
  ], run = "arrow -1", desc = "向上移动光标" },
  { on = [
    "<C-n>",
  ], run = "arrow 1", desc = "向下移动光标" },

  { on = [
    "~",
